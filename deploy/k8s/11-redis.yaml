# Redis —— 单副本 Deployment + AOF
#
# ⚠️ 同样是最小可用形态：Redis 在这里承载登录态与登录失败计数，
#    单副本挂掉会让全员掉线。生产请用云 Redis 或哨兵/集群版。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  namespace: hospital
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: hospital-redis
  namespace: hospital
  labels:
    app: hospital-redis
spec:
  type: ClusterIP
  selector:
    app: hospital-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hospital-redis
  namespace: hospital
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hospital-redis
  template:
    metadata:
      labels:
        app: hospital-redis
    spec:
      containers:
        - name: redis
          image: redis:7.4-alpine
          imagePullPolicy: IfNotPresent
          # AOF：重启后登录态还能恢复
          args: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
          ports:
            - name: redis
              containerPort: 6379
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: redis-data
