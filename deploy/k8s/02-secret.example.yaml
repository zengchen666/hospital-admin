# ⚠️ 这是模板，不是要 apply 的文件。
#
# 正确做法是把密钥留在集群里、不落进仓库：
#
#   kubectl -n hospital create secret generic hospital-secret \
#     --from-literal=DB_USERNAME=hospital \
#     --from-literal=DB_PASSWORD='<强密码>' \
#     --from-literal=MYSQL_ROOT_PASSWORD='<强密码>' \
#     --from-literal=REDIS_PASSWORD='' \
#     --from-literal=JWT_SECRET="$(openssl rand -base64 48)" \
#     --from-literal=HOSPITAL_AES_KEY="$(openssl rand -base64 32)"
#
# 该文件也刻意没有写进 kustomization.yaml，避免 kubectl apply -k 一把把占位值推上去。
#
# ⚠️ HOSPITAL_AES_KEY 一换，库里已加密的身份证/手机号就解不开了。
#    接入既有库时必须沿用原密钥。

apiVersion: v1
kind: Secret
metadata:
  name: hospital-secret
  namespace: hospital
type: Opaque
stringData:
  DB_USERNAME: "hospital"
  DB_PASSWORD: "CHANGE_ME"
  MYSQL_ROOT_PASSWORD: "CHANGE_ME"
  REDIS_PASSWORD: ""
  JWT_SECRET: "CHANGE_ME"
  HOSPITAL_AES_KEY: "CHANGE_ME"
